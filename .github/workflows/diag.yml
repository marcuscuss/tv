name: Diagnóstico temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp/buscar.js && cat assets/logos/cand/lista.txt
      - run: |
          git config user.name "joi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos/cand
          git commit -m "Temporal: candidatos de logos" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
