name: Diagnóstico temporal
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: ESPN, CORS y Letterboxd
        run: node scripts/tmp/probe.js
      - name: ATP con Playwright
        run: |
          cd scripts/tmp && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null 2>&1
          node atp.js || true
