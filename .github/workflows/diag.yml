name: Diagnóstico temporal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Grabar arcmarumo.com
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium > /dev/null
          node scripts/tmp/arc.js
          ls -la tmp-ref | head -100
          du -sh tmp-ref
      - name: Guardar capturas (temporal)
        run: |
          find tmp-ref -size +20M -delete
          git config user.name "joi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-ref
          git commit -m "Referencia temporal de arcmarumo.com (se borra después)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
