name: Actualizar datos

# Capa lenta de Joi: cada 6 horas (y a mano desde Actions) cada fuente escribe su
# JSON en /data. Si una falla, conserva su JSON anterior y no rompe a las demás.
# Solo se hace commit si algo cambia.
# Secretos (Settings → Secrets and variables → Actions): TMDB_API_KEY y FOOTBALL_DATA_KEY.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # para guardar los JSON en el repo
  pages: write      # para pedir que se republique la web con los datos nuevos

concurrency:
  group: datos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Letterboxd (diario y listas)
        continue-on-error: true
        run: node scripts/letterboxd.js

      - name: Estrenos de cine
        continue-on-error: true
        run: node scripts/estrenos.js

      - name: Recomendaciones (TMDB)
        continue-on-error: true
        run: node scripts/recomendaciones.js

      - name: Real Madrid
        continue-on-error: true
        run: node scripts/madrid.js

      - name: Playwright para la web de la ATP
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Tenis (ATP con respaldo ESPN, WTA)
        continue-on-error: true
        run: node scripts/tenis.js

      - name: Guardar si hay cambios
        id: commit
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "joi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Republicar la web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
