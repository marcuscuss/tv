name: Actualizar estrenos

# Cada 12 horas (y a mano desde la pestaña Actions) descarga de TMDB la
# cartelera y los próximos estrenos de cines en España → data/estrenos.json.
# Necesita el secreto TMDB_API_KEY (Settings → Secrets and variables → Actions).
on:
  schedule:
    - cron: '41 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write   # para guardar el JSON en el repo
  pages: write      # para pedir que se republique la web con los datos nuevos

concurrency:
  group: estrenos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar estrenos de TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/estrenos.js

      - name: Guardar si hay cambios
        id: commit
        run: |
          git add -A data/estrenos.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "joi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar estrenos de cine"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Republicar la web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
