name: Actualizar Letterboxd

# Cada 6 horas (y a mano desde la pestaña Actions) descarga el diario y las listas
# de los usuarios de letterboxd-users.json y los guarda en data/letterboxd/USUARIO.json.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write   # para guardar los JSON en el repo
  pages: write      # para pedir que se republique la web con los datos nuevos

concurrency:
  group: letterboxd
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Descargar diario y listas de Letterboxd
        run: node scripts/letterboxd.js

      - name: Guardar si hay cambios
        id: commit
        run: |
          mkdir -p data/letterboxd
          git add -A data/letterboxd
          if git diff --cached --quiet; then
            echo "Sin cambios"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "joi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar datos de Letterboxd"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Republicar la web
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
