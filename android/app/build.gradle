plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marcuscuss.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.marcuscuss.tvlauncher"
        minSdk 21          // cubre Fire TV Stick antiguos (Fire OS 5 / Android 5.1)
        targetSdk 34
        versionCode 3
        versionName "0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // firma de debug: instalable sin configurar nada
        }
    }

    lint {
        abortOnError false        // los avisos de lint no deben romper la compilación en GitHub
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
}
