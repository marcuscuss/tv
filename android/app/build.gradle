plugins {
    id 'com.android.application'
}

android {
    namespace 'com.marcuscuss.tvlauncher'
    compileSdk 34

    defaultConfig {
        applicationId "com.marcuscuss.tvlauncher"
        minSdk 21          // cubre Fire TV Stick antiguos (Fire OS 5 / Android 5.1)
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // firmado con la clave de debug para poder instalar sin configurar nada
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


dependencies {
}
